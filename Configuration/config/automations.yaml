  description: ''
  triggers:
  - trigger: event
    event_type: tag_scanned
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.tag_id in tags }}'
  - condition: template
    value_template: '{{ trigger.event.data.device_id in media_players }}'
  actions:
  - variables:
      media_player_entity_id: '{{ media_players[trigger.event.data.device_id] }}'
      media_content_id: '{{ tags[trigger.event.data.tag_id].media_content_id }}'
      media_content_type: '{{ tags[trigger.event.data.tag_id].media_content_type }}'
  - action: media_player.play_media
    target:
      entity_id: '{{ media_player_entity_id }}'
    data:
      media:
        media_content_id: '{{ media_content_id }}'
        media_content_type: '{{ media_content_type }}'
        metadata: {}
  - delay: 2
  max_exceeded: silent
  variables:
    media_players:
      534b418df6a5787612b93a69d68980fc: media_player.kitchen_2
    tags:
      53-B2-B1-7E-01-00-01:
        media_content_id: Ollie Dance
        media_content_type: playlist
      53-70-AA-7E-01-00-01:
        media_content_id: 60s Night
        media_content_type: playlist
