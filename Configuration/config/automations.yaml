- id: '1756558651320'
  alias: Entrance Hallway Motion Detected
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.entrance_hallway_sensor
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - if:
    - condition: sun
      before: sunrise
      after: sunset
      before_offset: 02:00:00
      after_offset: -02:00:00
    then:
    - if:
      - condition: time
        after: '22:00:00'
        before: 06:00:00
      then:
      - action: light.turn_on
        metadata: {}
        data:
          color_temp_kelvin: 2000
          brightness_pct: 1
          transition: 5
        target:
          entity_id: light.entrance_hallway_lights
      else:
      - if:
        - condition: time
          after: '21:00:00'
          before: 07:00:00
        then:
        - action: light.turn_on
          metadata: {}
          data:
            color_temp_kelvin: 3383
            brightness_pct: 30
            transition: 5
          target:
            entity_id: light.entrance_hallway_lights
        else:
        - action: light.turn_on
          metadata: {}
          data:
            color_temp_kelvin: 3843
            brightness_pct: 100
            transition: 5
          target:
            entity_id: light.entrance_hallway_lights
  mode: single
