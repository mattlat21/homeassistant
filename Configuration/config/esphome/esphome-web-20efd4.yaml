esphome:
  name: hot-water-heater
  friendly_name: Hot Water Heater

esp32:
  board: adafruit_feather_esp32_v2
  variant: esp32
  flash_size: 8MB
  framework:
    type: arduino

logger:
  level: INFO
  baud_rate: 0

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    # password: "skdfufjj$474Da"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  fast_connect: true
  power_save_mode: none
  reboot_timeout: 2min

  #ap:
  #  ssid: "Hot Water Heater Fallback"
  #  password: "fallback123"

captive_portal:

web_server:
  port: 80

switch:
  - platform: gpio
    name: "Boost Mode"
    pin: GPIO27
    id: boost_mode
    restore_mode: ALWAYS_OFF

output:
  - platform: gpio
    pin: GPIO13
    id: onboard_led

light:
  - platform: binary
    name: "Hot Water Heater LED"
    output: onboard_led

  - platform: esp32_rmt_led_strip
    name: "Hot Water Heater NeoPixel"
    id: neopixel
    pin: GPIO0
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF

sensor:

  # ---------------------------------------------------------
  # Wifi Signal Strength
  # ---------------------------------------------------------

  # - platform: wifi_signal
  #   name: "WiFi Signal Strength"
  #   id: wifi_signal_db
  #   update_interval: 2s

  - platform: wifi_signal
    name: "WiFi Signal Strength"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Strength Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic

  # ---------------------------------------------------------
  # Water Temperature
  # ---------------------------------------------------------

  # Voltage
  - platform: adc
    pin: A0               # From water sensor terminal block
    id: water_temp_voltage
    name: "Water Temp Voltage"
    attenuation: 12db
    update_interval: 1s   # Sample every second
    filters:
      - sliding_window_moving_average:
          window_size: 60 # Averate over 60 samples (1s x 60 = 1 minute)
          send_every: 30  # Update every 30 samples (1s x 30 = 30 seconds)
    accuracy_decimals: 2
    internal: false       # Explicitly make visible

  # Temperature
  - platform: copy
    source_id: water_temp_voltage
    name: "Water Temperature"
    icon: "mdi:water-thermometer"
    unit_of_measurement: "°C"
    accuracy_decimals: 0  # Optional: Adjust precision
    filters:
      - calibrate_linear:
          - 1.93 -> 18    # Example: Voltage 1.93V maps to 18°C
          - 0.94 -> 51    # Example: Voltage 0.94V maps to 51°C  

  # ---------------------------------------------------------
  # In Error?
  # ---------------------------------------------------------

  - platform: adc
    pin: A1               # From Error LED
    id: led_error_voltage
    name: "LED Error Voltage"
    attenuation: 12db
    update_interval: 100ms # Sample every 100ms
    filters:
      - sliding_window_moving_average:
          window_size: 40  # Average over 40 samples (100ms x 40 = 4 seconds)
          send_every: 20   # Update every 20 samples (100ms x 20 = 2 second)
    accuracy_decimals: 2
    internal: false        # Explicitly make visible

  # ---------------------------------------------------------
  # Is Running?
  # ---------------------------------------------------------

  - platform: adc
    pin: A2               # From Run LED
    id: led_run_voltage
    name: "LED Run Voltage"
    attenuation: 12db
    update_interval: 5s
    filters:
      - sliding_window_moving_average:
          window_size: 40  # Average over 40 samples (100ms x 40 = 4 seconds)
          send_every: 20   # Update every 20 samples (100ms x 20 = 2 second)
    accuracy_decimals: 2
    internal: false        # Explicitly make visible