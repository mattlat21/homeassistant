# Panels -> Home Assistant: Front Door screen light controls.
# Panels publish {"light": "<slug>", "power": "on"|"off"} on a toggle tap and
# {"light": "<slug>", "brightness": <0-100>} on slider release, to
# esp_hmi/device/<mac>/status/light_set.

alias: ESP HMI - Light Set
description: Applies Front Door screen light power/brightness commands from the ESP HMI panels
triggers:
  - trigger: mqtt
    topic: esp_hmi/device/+/status/light_set
variables:
  # Slugs must match the panel firmware (screen_front_door.c) and ha_automation_data_lights.yaml.
  panel_lights:
    outside: light.front_door_lights
    lounge: light.lounge_room_lights
    hallway: light.entrance_hallway_lights
  target_entity: "{{ panel_lights.get(trigger.payload_json.light, '') }}"
conditions:
  - condition: template
    value_template: "{{ target_entity != '' }}"
actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.power | default('') == 'on' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ target_entity }}"
      - conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.power | default('') == 'off' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ target_entity }}"
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.payload_json.brightness is defined
              and (trigger.payload_json.brightness | int(0)) > 0 }}
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ target_entity }}"
            data:
              brightness_pct: "{{ trigger.payload_json.brightness | int(0) }}"
      - conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.brightness is defined }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ target_entity }}"
mode: parallel
max: 12
